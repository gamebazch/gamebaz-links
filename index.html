<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="راه‌های دنبال‌کردن گیم‌باز در یوتیوب و تلگرام">
  <title>کانال‌های گیم‌باز</title>
  <style>
    :root { color-scheme: dark; --bg:#111318; --card:#1a1d24; --line:#2a2e38; --text:#f4f5f7; --muted:#a5a9b3; --accent:#d7ff4f; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:28px 18px; background:var(--bg); color:var(--text); font-family:Tahoma,Arial,sans-serif; }
    main { width:min(100%, 420px); text-align:center; }
    .logo { width:104px; height:104px; object-fit:cover; border-radius:50%; border:2px solid var(--line); }
    h1 { margin:18px 0 26px; font-size:1.45rem; font-weight:700; letter-spacing:-.03em; }
    nav { display:grid; gap:12px; }
    a { min-height:58px; display:flex; align-items:center; justify-content:center; padding:14px 18px; border:1px solid var(--line); border-radius:14px; color:var(--text); background:var(--card); text-decoration:none; font-size:1rem; font-weight:700; transition:transform .15s ease,border-color .15s ease,background .15s ease; }
    a:hover, a:focus-visible { transform:translateY(-2px); border-color:var(--accent); background:#20242b; outline:none; }
    a:focus-visible { box-shadow:0 0 0 3px #d7ff4f44; }
    footer { margin-top:26px; color:var(--muted); font-size:.82rem; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/gamebaz-logo.jpg" alt="لوگوی گیم‌باز">
    <h1>کانال‌های گیم‌باز</h1>
    <nav aria-label="پیوندهای گیم‌باز">
      <a href="https://apgy.in/c/@gamebaz.z" target="_blank" rel="noopener noreferrer">کانال اصلی یوتیوب</a>
      <a href="https://apgy.in/c/@GameBazLiveTV" target="_blank" rel="noopener noreferrer">کانال لایو استریم</a>
      <a href="https://t.me/gamebaz_news" target="_blank" rel="noopener noreferrer">کانال تلگرام</a>
    </nav>
    <footer>گیم‌باز</footer>
  </main>
</body>
</html>
